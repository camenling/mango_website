# 芒果签 — 宝塔 Nginx 反代示例（sign.mangoios.com → Docker 127.0.0.1:8199）
# 用法：复制 location / 与 client_max_body_size 到面板生成的 server { listen 443 ssl ... } 内；
#       删除 enable-php、rewrite、root 指向 wwwroot 的静态站配置（应用不在 wwwroot 里跑）。
#
# 常见故障：面板自带的 location ~ .*\.(js|css)?$ 会从 root 读磁盘，/assets/*.js 404。
# 必须注释/删除 js|css|gif|jpg 等静态 location，让请求走下方 location / 反代。

# ---------- 以下为 listen 443 ssl 的 server 内建议内容（SSL 证书行由宝塔自动写入）----------

    client_max_body_size 50m;

    include /www/server/panel/vhost/nginx/extension/sign.mangoios.com/*.conf;

    location ~ \.well-known {
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:8199;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    access_log  /www/wwwlogs/sign.mangoios.com.log;
    error_log   /www/wwwlogs/sign.mangoios.com.error.log;

